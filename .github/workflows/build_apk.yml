name: Build Tamil Manthar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Recreate Android Structure & Inject Royal Gold Icon
        run: |
          flutter create --project-name tamil_manthar --platforms=android .
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # கேமரா அனுமதிகளை Manifest-ல் சேர்த்தல்
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
          '''
          if 'android.permission.CAMERA' not in c:
              c = c.replace('<application', perms + '\n    <application')
          with open(p, 'w') as f:
              f.write(c)
          "

          # அசல் ராயல் லோகோவை Android-ன் அனைத்து mipmap கோப்புறைகளிலும் நேரடியாகப் பதிவேற்றுதல்
          python3 -c "
          import os
          from PIL import Image
          
          icon_path = 'assets/app_icon.png'
          if os.path.exists(icon_path):
              im = Image.open(icon_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': (48, 48),
                  'mipmap-hdpi': (72, 72),
                  'mipmap-xhdpi': (96, 96),
                  'mipmap-xxhdpi': (144, 144),
                  'mipmap-xxxhdpi': (192, 192)
              }
              res_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  out_im = im.resize(size, Image.Resampling.LANCZOS)
                  out_im.save(os.path.join(target_dir, 'ic_launcher.png'))
                  # ஆண்ட்ராய்டு அடாப்டிவ் ஐகான்களுக்கும் ஒரே லோகோ
                  out_im.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  out_im.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
              print('Successfully injected Royal Gold icons into all mipmap folders!')
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-manthar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
