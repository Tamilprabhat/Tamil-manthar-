name: Build Tamil Manthar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Recreate Standard Android Files
        run: |
          flutter create --project-name tamil_manthar --platforms=android .
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
          '''
          if 'android.permission.CAMERA' not in c:
              c = c.replace('<application', perms + '\n    <application')
          with open(p, 'w') as f:
              f.write(c)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: |
          if [ -f "assets/app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-manthar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
