name: Build Tamil Manthar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Python Pillow
        run: python3 -m pip install --upgrade Pillow

      - name: Verify Tesseract Models
        run: |
          mkdir -p assets/tessdata
          if [ ! -s assets/tessdata/tam.traineddata ]; then
            curl -L -o assets/tessdata/tam.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/tam.traineddata
          fi
          if [ ! -s assets/tessdata/eng.traineddata ]; then
            curl -L -o assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          fi

      - name: Recreate Android, Set App Label and Inject Royal Gold Icon
        run: |
          flutter create --project-name tamil_manthar --platforms=android .
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Manifest-ல் நேரடி தமிழ் லேபிள் 'தமிழ் மாந்தர்' அமைத்தல்
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.INTERNET\" />
          '''
          if 'android.permission.CAMERA' not in c:
              c = c.replace('<application', perms + '\n    <application')
          
          # லேபிளை தமிழ் மாந்தர் என மாற்றுதல்
          import re
          c = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"தமிழ் மாந்தர்\"', c)
          c = c.replace('android:icon=\"@mipmap/ic_launcher\"', 'android:icon=\"@mipmap/ic_launcher\"')
          
          with open(p, 'w') as f:
              f.write(c)
          "

          # அனைத்து mipmap கோப்புறைகளிலும் அடாப்டிவ் முரண்பாடின்றி அசல் லோகோவை பதித்தல்
          python3 -c "
          import os, shutil
          from PIL import Image
          
          res_dir = 'android/app/src/main/res'
          
          # அடாப்டிவ் xml கோப்புறைகளை முழுமையாக அழித்தல்
          for fld in ['mipmap-anydpi-v26', 'drawable-v21', 'drawable']:
              p = os.path.join(res_dir, fld)
              if os.path.exists(p):
                  for item in os.listdir(p):
                      if 'ic_launcher' in item:
                          try: os.remove(os.path.join(p, item))
                          except: pass

          icon_path = 'assets/app_icon.png'
          if os.path.exists(icon_path):
              im = Image.open(icon_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': (48, 48),
                  'mipmap-hdpi': (72, 72),
                  'mipmap-xhdpi': (96, 96),
                  'mipmap-xxhdpi': (144, 144),
                  'mipmap-xxxhdpi': (192, 192)
              }
              for folder, size in sizes.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  out_im = im.resize(size, Image.Resampling.LANCZOS)
                  out_im.save(os.path.join(target_dir, 'ic_launcher.png'))
                  out_im.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  out_im.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
              print('Royal Gold icon written to all mipmaps successfully!')
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-manthar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
