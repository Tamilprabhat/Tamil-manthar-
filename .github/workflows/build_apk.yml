name: Build Tamil Manthar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Python Pillow
        run: python3 -m pip install --upgrade Pillow

      - name: Verify Tesseract Models
        run: |
          mkdir -p assets/tessdata
          if [ ! -s assets/tessdata/tam.traineddata ]; then
            curl -L -o assets/tessdata/tam.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/tam.traineddata
          fi
          if [ ! -s assets/tessdata/eng.traineddata ]; then
            curl -L -o assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          fi

      - name: Recreate Android, Set App Label and Inject Royal Gold Icon
        run: |
          flutter create --project-name tamil_manthar --platforms=android .
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.INTERNET\" />
          '''
          if 'android.permission.CAMERA' not in c:
              c = c.replace('<application', perms + '\n    <application')
          
          c = c.replace('android:label=\"tamil_manthar\"', 'android:label=\"Tamil Manthar\"')
          c = c.replace('android:icon=\"@mipmap/ic_launcher\"', 'android:icon=\"@mipmap/app_gold_icon\"')
          
          with open(p, 'w') as f:
              f.write(c)
          "

          python3 -c "
          import os, shutil
          from PIL import Image
          
          res_dir = 'android/app/src/main/res'
          anydpi_dir = os.path.join(res_dir, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)

          icon_path = 'assets/app_icon.png'
          if os.path.exists(icon_path):
              im = Image.open(icon_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': (48, 48),
                  'mipmap-hdpi': (72, 72),
                  'mipmap-xhdpi': (96, 96),
                  'mipmap-xxhdpi': (144, 144),
                  'mipmap-xxxhdpi': (192, 192)
              }
              for folder, size in sizes.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  out_im = im.resize(size, Image.Resampling.LANCZOS)
                  out_im.save(os.path.join(target_dir, 'ic_launcher.png'))
                  out_im.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  out_im.save(os.path.join(target_dir, 'app_gold_icon.png'))
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-manthar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
