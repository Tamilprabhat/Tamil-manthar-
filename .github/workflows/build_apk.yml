name: Build Tamil Manthar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Recreate Android Project Files
        run: |
          flutter create --project-name tamil_manthar --platforms=android .
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # image_cropper-க்கு தேவையான UCropActivity-ஐ AndroidManifest.xml-ல் சேர்த்தல்
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              content = f.read()
          cropper_activity = '''
                  <activity
                      android:name=\"com.yalantis.ucrop.UCropActivity\"
                      android:screenOrientation=\"portrait\"
                      android:theme=\"@style/Theme.AppCompat.Light.NoActionBar\"/>
          '''
          if 'UCropActivity' not in content:
              content = content.replace('</application>', cropper_activity + '\n    </application>')
          with open(p, 'w') as f:
              f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-manthar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
