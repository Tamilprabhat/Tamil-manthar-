name: Build Tamil Manthar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Android Structure
        run: |
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            flutter create . --platforms=android --org com.tamilmanthar.app
          fi
          echo "android.enableNewDsl=false" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-manthar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
