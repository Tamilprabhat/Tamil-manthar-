name: tamil_manthar
description: "A Tamil OCR mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  image: ^4.1.7
  path_provider: ^2.1.2
